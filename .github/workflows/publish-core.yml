name: Publish @hermes/core

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - '.github/workflows/publish-core.yml'

  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Tipo de bump (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint || echo "lint warnings (non-blocking en alpha)"

      - name: Bump version (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.version_bump }} --workspace=@hermes/core
          git push origin main --follow-tags

      - name: Publish to npm
        run: npm publish --workspace=@hermes/core --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
